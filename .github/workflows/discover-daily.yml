name: Discover daily topics

on:
  schedule:
    # Morning + afternoon UTC (~ aligns with twice-daily nudges)
    - cron: "0 6 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Build core
        run: npx tsc -p packages/core/tsconfig.json
      - name: Run discovery
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-daily.mjs
      - name: Commit daily feed
        run: |
          git config user.name "devly-bot"
          git config user.email "devly-bot@users.noreply.github.com"
          git add content/daily/daily.json content/daily/quality-report.json
          if git diff --staged --quiet; then
            echo "No feed changes"
          else
            git commit -m "chore(discovery): refresh daily topic feed"
            git push
          fi
      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-feed
          path: |
            content/daily/daily.json
            content/daily/quality-report.json
